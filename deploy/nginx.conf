# Serves the built site (dist/) on :8080 behind Traefik, which terminates TLS.

# www.chrisjowen.net is an alias: send it to the apex.
server {
    listen 8080;
    server_name www.chrisjowen.net;
    server_tokens off;
    return 301 https://chrisjowen.net$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/xml application/manifest+json text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed files never change, so cache them for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest.
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
